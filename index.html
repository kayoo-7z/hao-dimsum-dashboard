<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hao Dimsum Dashboard - 2440304009</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <a href="#main">Lewati ke konten utama</a>
        <h1>Hao Dimsum Web Order</h1>
        <p>Nama: Zaskia Anugrah H | NPM: 2440304009</p>
        <nav aria-label="Navigasi utama">
            <a href="#menu">Menu</a>
            <a href="#pesan">Form Pesanan</a>
        </nav>
    </header>

    <main id="main">
        <section id="menu">
            <h2>Daftar Menu Hao Dimsum</h2>
            
        <!-- Kontrol Search & Sorting (Full Layar / Lebar Penuh) -->
            <div class="controls" style="margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 1rem; width: 100%; background: transparent; border: none; padding: 0; box-shadow: none;">
                <input type="text" id="search-input" placeholder="Cari menu dimsum..." style="padding: 0.75rem 1rem; width: 100%; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1rem; background: #fff;">
                
                <select id="sort-select" style="padding: 0.75rem 1rem; width: 100%; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1rem; background: #fff;">
                    <option value="default">Urutkan Menu</option>
                    <option value="az">Nama (A - Z)</option>
                    <option value="za">Nama (Z - A)</option>
                    <option value="price-low">Harga (Terendah - Tertinggi)</option>
                    <option value="price-high">Harga (Tertinggi - Terendah)</option>
                </select>
            </div>

            <div id="api-output" class="cards">
                <!-- Data produk dari API akan dimuat di sini -->
            </div>
<!-- Section Form Pemesanan (Full Lebar Kontainer) -->
    <section id="pesan" style="width: 100%; margin: 3rem 0; background: var(--surface); padding: 2rem; border-radius: var(--radius); border: 2px solid #f0ded3; box-shadow: 0 4px 6px rgba(200, 90, 50, 0.08);">
        <h2 style="color: var(--brand-orange); text-align: center; margin-top: 0; font-size: 1.5rem;">Form Pemesanan Hao Dimsum</h2>
        <p id="form-status" style="text-align: center; font-weight: bold; color: #555; font-size: 0.9rem; margin-bottom: 1rem;"></p>
        
        <form id="form-order" novalidate>
            <div style="margin-bottom: 1rem;">
                <label for="pemesan" style="display: block; font-weight: bold; margin-bottom: 0.3rem; font-size: 0.9rem;">Nama Pemesan</label>
                <input type="text" id="pemesan" name="pemesan" placeholder="Masukkan nama Anda..." required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1rem;">
                <span id="error-pemesan" class="error" style="color: #dc2626; font-size: 0.8rem;"></span>
            </div>

            <div style="margin-bottom: 1rem;">
                <label for="nama-menu" style="display: block; font-weight: bold; margin-bottom: 0.3rem; font-size: 0.9rem;">Nama Menu Dimsum</label>
                <input type="text" id="nama-menu" name="namaMenu" placeholder="Contoh: Hakao Udang / Shumai Ayam" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1rem;">
                <span id="error-menu" class="error" style="color: #dc2626; font-size: 0.8rem;"></span>
            </div>

            <div style="margin-bottom: 1rem;">
                <label for="jumlah" style="display: block; font-weight: bold; margin-bottom: 0.3rem; font-size: 0.9rem;">Jumlah Porsi (Minimal 1)</label>
                <input type="number" id="jumlah" name="jumlah" min="1" placeholder="Contoh: 2" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1rem;">
                <span id="error-jumlah" class="error" style="color: #dc2626; font-size: 0.8rem;"></span>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label for="konfirmasi-jumlah" style="display: block; font-weight: bold; margin-bottom: 0.3rem; font-size: 0.9rem;">Konfirmasi Ulang Jumlah Porsi</label>
                <input type="number" id="konfirmasi-jumlah" name="konfirmasiJumlah" placeholder="Masukkan ulang jumlah porsi..." required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1rem;">
                <span id="error-konfirmasi" class="error" style="color: #dc2626; font-size: 0.8rem;"></span>
            </div>

            <button type="submit" style="width: 100%; padding: 0.85rem; background-color: var(--brand-orange); color: white; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s;">Kirim Pesanan</button>
        </form>
    </section>
    </main>

    <footer>
        <p>Nama: Zaskia Anugrah H | NPM: 2440304009 | Kelas: Teknik Komputer - Semester 5</p>
        <p>&copy; 2026 Hao Dimsum Web Order</p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
