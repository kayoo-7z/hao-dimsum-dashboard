<html lang="id">
<head>

<body>
    <header>
        <a href="#main">Lewati ke konten utama</a>

    <main id="main">
        <section id="menu">
            <h2>Daftar Menu Hao Dimsum</h2>
            
            <!-- Tambahan Kontrol Search & Sorting (Varian NIM Y=0) -->

                <input type="text" id="search-input" placeholder="Cari menu dimsum..." style="padding: 0.6rem; flex: 1; min-width: 200px; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1rem;">
                
                <select id="sort-select" style="padding: 0.6rem; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1rem;">
                    <option value="default">Urutkan Menu</option>
                    <option value="az">Nama (A - Z)</option>
                    <option value="za">Nama (Z - A)</option>
                    <option value="price-low">Harga (Terendah - Tertinggi)</option>
                    <option value="price-high">Harga (Tertinggi - Terendah)</option>
                </select>
            </div>

            <div id="api-output" class="cards">
                <!-- Data produk dari API akan dimuat di sini -->
            </div>
        </section>
    </main>
